:root{--bg:#f5f6f8;--card:#fff;--text:#1d2329;--sub:#5d6670;--line:#d9dde2;--accent:#1f4e79;--ok:#1a7f37;--chip:#e7ecf2}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2226;--text:#e8ebee;--sub:#9aa4ae;--line:#2d343a;--accent:#7fb2e5;--ok:#56c273;--chip:#272e34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Yu Gothic UI","Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 8px}
.q{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.chip{flex:none;border:0;border-radius:999px;padding:6px 14px;background:var(--chip);color:var(--text);font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}
.count{font-size:13px;color:var(--sub);margin-top:6px}
main{padding:10px 16px 28px;max-width:760px;margin:0 auto}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0}
summary{list-style:none;cursor:pointer;padding:12px 14px}
summary::-webkit-details-marker{display:none}
.top{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;justify-content:space-between}
.top>div{min-width:0}
.nm{font-weight:700}
.no{color:var(--accent);margin-right:.5em;font-weight:700;white-space:nowrap}
.st{font-size:13px;color:var(--sub);max-width:100%}
.st.ok{color:var(--ok)}
.ds{font-size:14px;color:var(--sub);margin-top:2px}
.body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.body h3{font-size:14px;color:var(--accent);margin:14px 0 4px}
.body p,.body ol,.body ul{margin:0}
.body ol,.body ul{padding-left:1.4em}
.body li{margin:5px 0}
.meta{font-size:13px;color:var(--sub);margin-top:12px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
footer{text-align:center;font-size:12px;color:var(--sub);padding:0 16px 30px}
mark{background:#ffe58a;color:#000;border-radius:3px}
</style>

<script id="data" type="application/json">[{"id":"0","kind":"system","label":"0番","name":"週報用画像リサイズ","category":"週報資料","status":"稼働中","desc":"週報用画像のリサイズ","overview":"スマホ等で撮った大きな画像（HEICも可）を、週報に貼り付けやすいサイズに縮小して「resized」フォルダに出すシステムです。元画像は「original」に退避されます。","steps":["縮小したい画像を、このフォルダの「image_inbox」に入れる（フォルダを開くボタンから開ける）。","常駐監視（watcher）が動いていれば、入れるだけで自動処理される。動いていないときは「▶ run.bat」を押して実行する。","処理が終わったら「resized」フォルダに縮小版ができているので、週報に使う。","元の画像は「original」に移っている。経過は resize_log.txt に記録される。"],"notes":["常駐監視が動いているかどうかは、claude_field直下の start_watcher.bat で起動状況を確認します。"],"cowork":"","keywords":"週報 画像 写真 リサイズ 縮小","folder":"0_claude_resize_image","guide":"image_inbox に画像を入れると自動処理（常駐監視が動いている場合）"},{"id":"1","kind":"system","label":"1番","name":"週報PDFの並べ替え・圧縮","category":"週報資料","status":"休止気味","desc":"週報PDFの並べ替え・圧縮","overview":"週報用のPDFを軽く（容量を小さく）するシステムです。メールやHPに載せられる大きさに圧縮します。文字が検索できる無損失圧縮を先に試し、効果が薄ければ画像変換で強く圧縮します（自動判断）。","steps":["圧縮したいPDFを「pdf_inbox」フォルダに入れる。","「▶ PDF圧縮.bat」を押して実行する（常駐監視が動いていれば入れるだけで自動）。","圧縮後のPDFは「pdf_done」に出る。元のPDFは「pdf_original」に退避される。"],"notes":["最近はあまり使われていません（休止気味）。週報のHP用PDF化は2番・31番が担当します。"],"cowork":"","keywords":"週報 PDF 圧縮 並べ替え","folder":"1_claude_resize_pdf","guide":"pdf_inbox にPDFを入れる、またはPDF圧縮.batを実行"},{"id":"2","kind":"system","label":"2番","name":"週報をHP掲載用PDFに変換","category":"週報資料","status":"稼働中","desc":"週報をHP掲載用PDFに変換","overview":"週報の原稿（Word）を、HP掲載用のPDFに変換するシステムです。WordでPDF化し、袋とじの並びを1〜4ページの正しい順に直し、必要なら圧縮して「週報原稿 YYYYMMDD_final.pdf」を作ります。さらにHP更新用素材フォルダに wp-YYYYMMDD.pdf としてコピーします。","steps":["完成した週報原稿のdocxを「word_inbox」フォルダに入れる。","「▶ 実行.bat」を押す（常駐監視が動いていれば自動で始まる）。複数あるときは一番新しいdocxが変換される。","同名のwp-…pdfが「2 新規更新素材」にすでにあると「上書きしますか？(y/N)」と聞かれるので、上書きなら y。","完了したら output フォルダに _final.pdf ができ、HP素材フォルダにも wp-YYYYMMDD.pdf が置かれる。元のdocxは original に移る。"],"notes":["週報の一連作業は31番（週報の一連作業）から、この番号を自動で呼び出せます。通常は31番から進めるのが楽です。","3「使用済み素材」に同名PDFがあるときは、アップロード済みの可能性があるのでコピーされません。"],"cowork":"","keywords":"週報 HP ホームページ PDF 変換","folder":"2_claude_bulletin_convert_pdf_for_hp","guide":"word_inbox に週報docxを入れる、または実行.batを実行（31番の進行表からも呼ばれる）"},{"id":"3","kind":"system","label":"3番","name":"日誌とGoogleカレンダー連携","category":"総務/日誌","status":"稼働中（週次）","desc":"Excel日誌とGoogleカレンダーの同期","overview":"Excelの日誌（2604日誌.xlsm）に書いた今後の予定を、AI（Gemini）で拾い出してGoogleカレンダーに登録するシステムです。日誌→カレンダーの一方向の連携です。ほかに、日誌へのメモ作成・一括追記のショートカットもあります。","steps":["「▶ 日誌からカレンダー連携」（LOGCAL.bat）を押す。","最初に出る「抽出開始日」のポップアップで、予定を拾い始める日付を選ぶ（通常は今日）。","裏でinbox監視が自動起動し、AIが日誌から今日以降の予定を抽出して、確認用のExcel（logcal_dataフォルダのschedule_日付.xlsm）が自動で開く。","Excelの内容を確認し、不要な行や誤りを直す。","Excelの「カレンダーに送信」ボタンを押す。すると監視が自動でGoogleカレンダー（（登録済みメールアドレス））に登録する。","登録が終わると画面に結果が表示される。確認したら閉じる。"],"notes":["日誌データの場所：OneDrive\\広島教会\\日常業務\\日誌\\2604日誌.xlsm","認証が切れたときは画面に「認証失敗」と出ます。画面の案内どおりtoken.jsonを削除して、もう一度実行してください。","日誌メモ作成・日誌に一括追記は、別のショートカットから起動します（6番の仕組みと連動）。"],"cowork":"","keywords":"日誌 カレンダー 予定 メモ 追記 Excel","folder":"3_claude_logcal","guide":"日誌データは「2604日誌.xlsm」"},{"id":"4","kind":"system","label":"4番","name":"執事宛 週次メール文","category":"総務/会議","status":"稼働中","desc":"役員向け週次報告メールの自動作成","overview":"執事の皆さんに送る週次のメール文案を自動で作るシステムです。日誌（Excel）・週報PDFの2ページ目・Googleカレンダーの内容をAI（Gemini）が読み、案を作って「Final_Reports」フォルダに保存します。","steps":["ランチャー上部の「進捗状況」に「4番 執事宛週次メール」が出たら押す（このカードが赤枠になり、進捗の画面が開く）","① 案を作成：「▶ 執事宛_週次メール文_作成」と同じ（日誌・週報PDF・カレンダーから案を作り、Wordで開く）。Wordで編集して整える","② 1004に反映：編集した案を、1004執事宛牧師通常連絡.docx の該当日付の欄へ文字の「１，」で書き込む（欄が無ければ新しく作る）","③ 下書きを作成：1004の該当欄から、前回の送信済みを元にOutlookの下書き（宛先・件名・17:00配信予約）を作る。送信はしない","④ Wordに戻す：下書き（または送信済み）の本文で1004の欄を差し替える。何度押してもよい。Outlookのバーの「SyncDeaconToWord」ボタンでも同じ","日誌に「執事共有」の行が案の作成後に増えたら、進捗の画面の「追加分を見る」で文案を確認し、必要なら1004へ追記する（③の前まで）"],"notes":["週報PDFが見つからないときは、メール案の先頭に「週報PDFがまだ見つかりません」という注意が出ます。HP掲載がまだの可能性があります。","新しい仕組みは 4_claude_report_for_deacon\\deacon_sync.py の1本だけ。run_report.bat に to-word / make-draft / from-outlook / diary-extra を付けても動く","宛先の表示名は deacon_names.json（アドレス→名前）に書くと、次回の下書きから表示名つきになる","上書き前の内容は 4_claude_report_for_deacon\\sync_backup に控えが残る","進捗の判定はファイルとOutlookを見るだけで、Claude/Geminiは呼ばない（トークンを使わない）","進捗の赤枠は、②③④の未完了は曜日を問わず出ます。「案が未作成」だけは金曜・土曜のみ（日誌が溜まる金曜までは催促しない。2026-10-20変更）","対象日は「直近の土曜」。土曜17:00を過ぎても日曜10:00前まではその土曜の分として作れる（17:00を過ぎると下書きに配信予約は付かず、手動で送信）。日曜10:00以降は次の土曜に切り替わる"],"cowork":"","keywords":"執事 役員 週次 報告 メール","folder":"4_claude_report_for_deacon","guide":""},{"id":"5","kind":"system","label":"5番","name":"説教日から過去説教確認","category":"説教","status":"稼働中（週次）","desc":"過去の並行箇所説教を検索・コピー","overview":"説教の準備のために、選んだ日曜日の聖書箇所（福音書は並行記事も含む）について、過去にした同じ箇所の説教を探してまとめるシステムです。リストのExcelと、該当説教のWordが一式そろって出力されます。","steps":["「▶ 説教準備」（デスクトップの「説教日から過去説教確認_説教まとめフォルダへ」）を押す。","説教する日曜日の日付を選ぶ（説教箇所・タイトルリストのExcelから聖書箇所を自動で取得）。","福音書の並行箇所も含めて、過去の同じ箇所の説教が検索される。","完了すると、このフォルダの中に日付フォルダ（例：20261011）ができ、「過去説教リスト_日付.xlsx」と、過去説教のWordファイル一式が入る。","フォルダを開くボタンで開いて、参考にしたい過去説教を読む。"],"notes":["説教の元データはOneDrive\\広島教会\\説教にあります。"],"cowork":"","keywords":"説教 並行箇所 過去説教 準備","folder":"5_claude_sermon_ preparation","guide":""},{"id":"6","kind":"system","label":"6番","name":"日誌TASKメール確認","category":"総務/メール","status":"稼働中","desc":"Gmail関連タスクのログ処理（推定）","overview":"日誌Excelへの記入を、メモを書くだけで済ませるシステムです。メモ（テキスト）を書くと、AI（Gemini）が日付・テーマ・対象・内容に整理して日誌に追記します。自分宛てのGmail（件名にTASK）からの取り込みもできます。","steps":["【メモから】「新しいメモを作成」（manual\\new_memo.bat）などでメモ帳を開く。","テンプレートの「テーマ・対象・内容」に書くか、テンプレートを消して口述のまま自由に書く（AIが整理してくれる）。複数件は「---」で区切る。","AIが整理した結果の確認画面が出るので、内容を直す。追記したくないときは項目を空欄にする。","メモ帳を保存して閉じると、日誌（2604日誌.xlsm）に自動で追記される。","【メールから】スマホから自分宛てに、件名に「TASK」を入れてメールを送っておく。PCの起動時に自動で取り込まれ、手動なら「▶ process_inbox.bat」やショートカット「日誌_TASKメール手動確認」を押す。"],"notes":["処理済みのメモは log_inbox\\processed に移動します。"],"cowork":"","keywords":"日誌 TASK メール Gmail タスク","folder":"6_claude_log_auto_rewrite","guide":"log_inbox にファイルを入れる方法もある"},{"id":"7","kind":"system","label":"7番","name":"説教ラボ（語句抽出・分析）","category":"説教","status":"低頻度","desc":"過去説教からのテーマ抽出・まとめ","overview":"過去の説教の文章から、指定したテーマ・キーワードに関わる部分を抜き出し、AI（Gemini）でまとめてWordにする分析システムです。使用頻度は低めです。","steps":["「▶ run.bat」（デスクトップの「説教_ワード抽出_分析」）を押す。","画面が開く（初回は必要なライブラリが自動導入される）。","画面の指示に従って、抽出したいテーマ（ワード）を入力し、実行する。","結果のWordが「説教まとめ」フォルダに保存される。使った資料は analysis_archive に退避される。"],"notes":["Geminiの設定（config.json）にAPIキーが必要です。","同じことをClaudeアプリで行いたいときは、S:event-explanationスキルも使えます。"],"cowork":"","keywords":"説教 語句 ワード 抽出 分析 テーマ","folder":"7_claude_sermon_labo","guide":""},{"id":"8","kind":"system","label":"8番","name":"QRコード作成","category":"その他","status":"休止","desc":"QRコード生成","overview":"入力したURLからQRコードを作るシンプルな画面ツールです。週報のPDF用など、日付付きのPDFのURLにも対応し、作ったQRは「QR_Pool」フォルダに溜まります。","steps":["「▶ qr_maker.pyw」（デスクトップの「QRコード作成」）を押す。","画面にQRコードにしたいURLを貼り付ける。","QRコードが作られて「QR_Pool」フォルダに画像として保存される。","できた画像を、必要な書類（Word等）に貼り付けて使う。"],"notes":["週報掲示用のQRは29番、週報の流れの中では31番から作れます。この8番は汎用の予備です。"],"cowork":"","keywords":"QR QRコード","folder":"8_claude_QR_maker","guide":""},{"id":"9","kind":"system","label":"9番","name":"AI管理台帳","category":"基盤","status":"最近使っていない","desc":"AI自動化管理ダッシュボード","overview":"作ってきたAI自動化の一覧を管理するExcel台帳（AI管理台帳.xlsx）を、タスクトレイに常駐するウィジェットで見られるようにしたものです。Claude／Gemini／NotebookLM／ローカルのタブで絞り込めます。","steps":["「▶ start_widget.bat」（デスクトップの「AI管理台帳」）を押す。","画面が開く（すでに常駐中なら、画面が前面に出る）。","上部のタブ（すべて／Claude／Gemini／NotebookLM／ローカル）で絞り込み、行をクリックして詳細を見る。","閉じてもタスクトレイに残る。完全に終了するときはトレイのアイコンから終了する。"],"notes":["最近はあまり使われていません。台帳の中身を直したいときは AI管理台帳.xlsx を直接開きます。"],"cowork":"","keywords":"管理台帳 ダッシュボード タスク AI","folder":"9_claude_AI_Task_Tracker","guide":""},{"id":"10","kind":"system","label":"10番","name":"賛美歌画像リネーム","category":"音楽/讃美歌","status":"休止","desc":"讃美歌画像を選曲リストと照合してリネーム","overview":"礼拝で歌う讃美歌の画像データを、Excelの選曲リストと照合し、「礼拝日・順番」の名前に付け替えて新しいフォルダにコピーするシステムです。足りない画像は不足リスト（Excel）で教えてくれます。","steps":["「▶ run_hymn_rename.bat」（デスクトップの「賛美歌画像準備」）を押す。","黒い画面で「対象月」を聞かれるので、「2026/6,2026/7」のように、年/月をカンマで区切って入力して Enter。","Excelの選曲リストから該当月の讃美歌が読み取られ、画像が「2026年6月21日(1)_新生93.jpg」のような名前でコピーされる（「追加」フォルダ）。","同じファイルが11番の「inbox」にも自動コピーされる（すでに11番で処理済みのものは再投入されない）。","不足している讃美歌は「要作成讃美歌_日付.xlsx」に出るので、その画像を用意する。","「処理が完了しました」と出たらEnterで閉じる。次は11番で歌詞画像（スライド）を作る。"],"notes":["設定（Excelや画像フォルダの場所）は config.ini にあります。"],"cowork":"","keywords":"讃美歌 賛美歌 画像 リネーム 選曲","folder":"10_claude_hymn_number_rename","guide":""},{"id":"11","kind":"system","label":"11番","name":"賛美歌歌詞 画像変換","category":"音楽/讃美歌","status":"稼働中（週次）","desc":"讃美歌画像から投影用スライド画像を生成","overview":"讃美歌の楽譜・歌詞の画像から、礼拝で映す「節ごとのスライド画像」（2100×900）を半自動で作るシステムです。画面で節の範囲を四角で囲んで保存していきます。","steps":["先に、10番で作った讃美歌画像が「inbox」フォルダに入っていることを確認する。","「▶ run_gui.bat」（デスクトップの「賛美歌歌詞_画像変換」）を押す。","画面に1曲ずつ画像が出る。マウスのドラッグで四角を作り、「節として追加」「くりかえしとして追加」を押して種類を決める（四隅で大きさ変更、中をドラッグで移動、Deleteで削除）。","全部の節を囲んだら「保存して次へ」を押す。節ごとの画像と全体画像が「output」に作られる。","次の曲に進み、inboxが空になるまで繰り返す。","処理済みの画像は「done」に、失敗したものは「error」に移る。"],"notes":["できた画像は、15番の礼拝スライド作成（Canva）で使われます。透過版は output_transparent に出ます。"],"cowork":"","keywords":"讃美歌 賛美歌 歌詞 スライド 投影 画像","folder":"11_claude_hymn_image_conversion","guide":""},{"id":"12","kind":"system","label":"12番","name":"YouTube配信スケジューラ","category":"配信/映像","status":"稼働中","desc":"説教予定からYouTubeライブ配信を自動予約","overview":"説教の予定（Excel）から、YouTubeのライブ配信の枠（「本番」10:30と「当日テスト」10:00）をまとめて自動で予約するシステムです。限定公開で作られ、OBSのストリームキーは変更不要です。","steps":["「▶ run_scheduler.bat」（デスクトップの「YouTube配信スケジューラ」）を押す。","初回だけ、ブラウザで教会のYouTubeのGoogleアカウントにログインして許可する。","今日以降の説教予定が一覧で出る。黄色の行は聖書箇所・説教題が未定なので、その場で入力する。水色の行は日曜以外（クリスマス等）なので礼拝名を入れる。「済」はすでに予約済み。","予約したい日にチェックを入れる（「今後1ヶ月／2ヶ月／3ヶ月」「未予約をすべて」で一括選択もできる）。ゲスト牧師の週は牧師名も直せる。","「選択内容を確認 →」でプレビューを見て、よければ「予約を作成する」を押す。"],"notes":["一度予約した日は重複して作られません。"],"cowork":"","keywords":"YouTube ユーチューブ 配信 ライブ 予約 ストリーミング","folder":"12_claude_youtube_live_streaming_edit","guide":""},{"id":"13","kind":"system","label":"13番","name":"週報の校正","category":"週報資料","status":"稼働中","desc":"週報の校正（Coworkスキル）","overview":"週報の原稿（Word）の誤字脱字・矛盾・重複・意味不明なところを、Claudeがチェックして指摘するCoworkスキルです。固定知識と除外リスト（known_ok.md）を参照します。","steps":["校正したい週報のdocxを用意する。","Claudeアプリ（Cowork）を開き、docxを添付して「週報を校正して」と話しかける。","指摘が返ってくるので、内容を確認して原稿を直す。","「指摘しなくてよい」と判断した表現は、除外リストに加えてもらうと、次回から指摘されなくなる。"],"notes":["カレンダーとの照合はウェブ版のClaudeでのみ使えます。"],"cowork":"週報を校正して","keywords":"週報 校正 誤字 チェック","folder":"13_claude_bulletin_review","guide":""},{"id":"14","kind":"system","label":"14番","name":"牧師預り金の清算","category":"財務","status":"稼働中","desc":"牧師預り金の清算・支払依頼票作成","overview":"牧師預り金の清算を助けるシステムです。領収書の写真をAI（Gemini）が読み取り、清算表（明細表）に追記し、支払い依頼票へ自動で転記して印刷まで行えます。","steps":["領収書をスマホで撮影し、Googleドライブの「領収書inbox」フォルダ（G:\\マイドライブ\\領収書inbox）に保存する。スキャンやメール添付のものは、このフォルダの「inbox」に直接置いてもよい。","「▶ 預り金清算ツール」（デスクトップの「預り金清算ツール」）を押して画面を開く。","「inbox読み込み」を押す（Googleドライブからの取り込みも同時に行われ、領収書の一覧が出る）。","一覧から1枚選び「選択ファイルを読み取る」を押す。日付・支払先・金額・内容がフォームに入る。画像がないときは「手入力で新規」を使う。","内容を確認・修正して「OK」。清算表の明細表に追記され、支払い依頼票が再生成され、画像は processed に移る。","全部終わったら、依頼票のシートを選んで「印刷」で既定のプリンターに出す。過去の請求は「検索」で確認できる。"],"notes":["本番かテストかは .env の DEPOSIT_ENV で決まります。本番運用は production（OneDrive\\広島教会\\清算の実ファイルが対象）。test のままだと練習用のコピーが書き換わります。","支払依頼票そのものは、デスクトップの「教会_支払依頼票」から開けます。","清算表・依頼票・清算書をExcelで開いたままでも、登録・編集・削除・依頼票作成・清算書作成ができます（開いていて保存済みなら自動で閉じて書き、開き直す）。ただし未保存の変更があると何もせず中止するので、保存してから実行します。「教会_支払依頼票」ショートカットで開くOneDriveの写しは見るだけのファイルなので、開いていても自動で閉じて最新にし、開き直します。印刷・プレビューは、本体が開いていても保存済みの内容で行います。","領収書の日付をAIが誤読する場合に備え、読み取った年月日がファイル名の日付（例 PXL_20261020_…jpg）と60日を超えてずれると、確認画面に警告が出ます（2026-10-20）。自動では直さないので、警告が出たら年月日を直してください（請求月は日付に自動で追従。請求月だけ別にしたいときは日付を直したあとで請求月欄を直す）。ファイル名に日付がないスキャン画像では出ません。"],"cowork":"","keywords":"預り金 清算 支払依頼票 領収書 会計 財務","folder":"14_claude_church_deposit_settlement","guide":"領収書は inbox（Googleドライブ）"},{"id":"15","kind":"system","label":"15番","name":"礼拝スライド作成（Canva）","category":"礼拝資料","status":"稼働中","desc":"礼拝スライド（説教5枚つき）の自動作成と、PNG・PPTX書き出し・印刷","overview":"日曜礼拝のスライド（Canva）を作るシステムです。日付を選ぶと、説教箇所・招詞・讃美歌をExcelから取り、Canva上で原本をコピーして文字と歌詞画像を流し込みます（Canva操作はClaude）。2026-10-20から、説教スライド5枚（タイトル＋項目4枚）の素材づくりと自動投入、完成後のPNG保存・PPTX保存・進行表の印刷（Claudeも不要）にも対応しました。","steps":["先に、その週の讃美歌の歌詞画像が11番で用意済みであることを確認する。","「▶ create_slide.bat」（デスクトップの「礼拝スライド作成（canva）」）を押し、礼拝の日付・招詞・聖書本文を入れて「決定」。slide_job.json ができる。","【説教スライドの素材】Claudeアプリで「説教スライドの素材を作って」（スキル sermon-slide-material。説教要旨の次に行う）。確認用.txt と Gem指示.txt ができるので、確認用.txt を直す。","Gem指示.txt をGemに貼って4パネル画像を作り、同じフォルダ（説教\\作業\\説教のプレゼンテーション\\yymmdd_説教スライド）にそのまま置く。","「▶ sermon_slides.bat 日付」で、4分割→確認画像を見て「y」→Canvaへアップロード→slide_job.json に統合。","VS CodeのClaude Codeで「slide_job.json を実行して」（礼拝スライド本体）、続けて「説教スライドを入れて（日付）」と頼む。Claudeが提示した内容を承認すると確定し、Canvaの編集URLが出る。","仕上げは create_slide.bat の画面下「書き出し・印刷（第三層）」ボタン。説教スライドのPNG保存、礼拝スライドのPPTX保存、進行表（9スライド横）の印刷確認まで行う。最後に Googleドライブの同期データ\\説教関連データ へコピーされる。"],"notes":["書き出し・印刷は初回だけCanvaの再認証が必要です。印刷は既定のプリンター（片面）で、印刷前に枚数と予定ページ数の確認（Y/N）が出ます。Nなら印刷されません。","保存済みのPNG・PPTXがあれば書き出し直さず、印刷だけやり直せます（-PrintOnly）。やり直すときは -Overwrite。","実運用の初回は、再認証のあと sermon_export.bat 20261101 を印刷の確認で N にして、保存結果を確認する想定です。","くわしくは 15番フォルダの README_slide_automation.md。","【2026-10-21 変更】讃美歌の歌詞画像の「白→透明の変換」と「Canvaへのアップロード」は、create_slide の②「透過変換 → Canvaへアップロード」（hymn_prepare.bat）が済ませる。Claudeは行わない。hymn_assets_日付.json が無いときは先に②を押す。","【2026-10-23】任意の動画などをCanvaへアップロードする canva_upload_video.ps1 を追加（お知らせスライドショー動画の取り込み用。slideshow_work フォルダに素材）。"],"cowork":"","keywords":"礼拝 スライド Canva キャンバ 投影 説教スライド 説教 書き出し PPTX PNG 印刷 Gem 4分割 歌詞画像 透過変換 hymn_prepare アップロード 讃美歌 お知らせ動画","folder":"15_claude_canva_slide_edit","guide":"①create_slide.bat で礼拝スライド本体 ②説教スライドは sermon_slides.bat ③仕上げに画面下の「書き出し・印刷」ボタン"},{"id":"16","kind":"system","label":"16番","name":"訃報チェック","category":"総務","status":"稼働中","desc":"連盟サイトの訃報監視・通知・PDF印刷","overview":"バプテスト連盟の総会サイト（soukai.bapren.jp）の「事務所から」を見張り、「訃報」で始まる新しい投稿が出たらPDFを自動でダウンロードし、メール通知と印刷までするシステムです。","steps":["通常は「▶ run_watch.bat」（デスクトップの「訃報チェック」）を押して実行する（PC起動時などに自動実行される設定の場合もある）。","サイトにログインして新着を確認し、新しい訃報があればPDFが「downloads」に保存される。","通知メールが届き、印刷が行われる。","結果は watch_log.txt に記録される。確認済みの投稿は記憶されるので、同じ訃報では重ねて通知されない。"],"notes":["ログインのID等は config.json にあります。Gmailの認証が切れたときは token.json を削除して再認証します。"],"cowork":"","keywords":"訃報 連盟 監視 印刷","folder":"16_claude_jbc_obituary_watch","guide":""},{"id":"17","kind":"system","label":"17番","name":"讃美歌プレイヤー","category":"音楽/讃美歌","status":"休止","desc":"オフラインMIDI讃美歌伴奏プレイヤー","overview":"礼拝で讃美歌のMIDI伴奏を流すための、完全オフラインのプレイヤーです（新生讃美歌693曲収録）。ブラウザで動き、インストールも通信も不要です。スマホのホーム画面にも入れられます。","steps":["「▶ 讃美歌プレイヤー」（デスクトップのショートカット、またはplayerフォルダのindex.html）をダブルクリック。ブラウザ（Chrome／Edge）で開く。","左の「全曲リスト」で、当日使う曲にチェックを入れる（番号や題名で検索できる）。右の「再生キュー」に並ぶので、▲▼で順番を直す。","大きな「▶ 開始」を押すと、選択中の1曲が流れる。曲が終わると次の曲が選ばれるが、自動では流れない。次に流すときは、もう一度「▶ 開始」を押す。","「■ 停止」で止める。「再生速度」（50〜150%）、「音質・音色」、練習用の「声部」も選べる。","設定は自動で保存され、閉じても復元される。「リセット」で全部消せる。"],"notes":["別のパソコンで使うときは、playerフォルダごとコピーします。"],"cowork":"","keywords":"讃美歌 賛美歌 プレイヤー MIDI 伴奏","folder":"17_claude_shinsei_hymn_player","guide":""},{"id":"18","kind":"system","label":"18番","name":"教会員・来会者名簿","category":"名簿/連絡","status":"稼働中","desc":"教会員名簿・来会者記録のスマホ連携","overview":"教会員名簿と来会者の記録を、スマホ（Googleスプレッドシート）で見られるようにするシステムです。PCのExcel名簿がマスターで、PCからスマホへデータを送り、スマホで書いた「変更メモ」をPCのマスターへ反映します。来会者は日誌から日曜の分を集めて、スマホで検索できます。","steps":["【外出先（スマホ）】Googleスプレッドシートのアプリで「会員名簿連携」を開き、「現在会員名簿」を閲覧・検索する。","修正したい点は「変更メモ」タブに、1件1行で書き留める。日曜に再会した来会者は「来会者」タブで氏名・日付で検索する。","【PCに戻ったら】「▶ run_sync.bat」（デスクトップの「教会員・来会者名簿　確認・修正」）をダブルクリックする。","変更メモがマスター（教会員管理ファイル.xlsm）に反映され、名簿が再生成されてスマホ側に最新が送られる。2026年度の日誌から日曜の来会者も追記される。","結果は「変更メモ」の状態列と logs フォルダで確認する。"],"notes":["マスターのxlsmをOneDriveとGoogleドライブで双方向にコピーする方式は使いません（競合・マクロ破損防止）。","残作業の手順は「Googleドライブ一本化_残作業手順.md」にあります。","日誌（2604日誌.xlsm）をExcelで開いたままでも、来会者の同期が動きます。"],"cowork":"","keywords":"名簿 教会員 来会者 住所 電話 スマホ","folder":"18_claude_church_member_list_manag","guide":""},{"id":"19","kind":"system","label":"19番","name":"写真アーカイブ整理","category":"写真","status":"休止","desc":"個人写真アーカイブ整理","overview":"古いアルバムをスキャンしたPDFから、1枚ずつの写真を検出して切り出し、整理・アップロードしていく個人写真アーカイブのプロジェクトです。現在は休止中で、Phase 1〜3のスクリプトが置かれています。","steps":["整理したいPDFを「聡写真」フォルダに置く、または写真を「inbox」に入れる。","phase1_run.py などのスクリプトを順に実行する（検出→確認→一括処理→Googleへアップロード）。","うまく切り出せなかったページは、review_template.html の確認画面で手直しする。"],"notes":["休止中のため、再開するときはClaudeに「19番を再開したい」と相談してください。手順の詳細は「写真アーカイブ_Phase1_指示書.md」にあります。"],"cowork":"","keywords":"写真 アーカイブ 整理 アルバム","folder":"19_claude_photo_maneger","guide":"inbox に写真を入れる"},{"id":"20","kind":"system","label":"20番","name":"記念日管理システム","category":"名簿/連絡","status":"稼働中","desc":"教会員記念日（誕生日・バプテスマ・召天・結婚）の通知・検索・葉書印刷","overview":"教会員の誕生日・バプテスマ記念日・召天日・結婚記念日を管理するシステムです。Googleカレンダー「教会員記念日」に毎朝通知が届き、PCのブラウザ画面では日付で検索したり、記念日葉書の宛先・印刷までできます。","steps":["【毎日の確認】スマホやPCのGoogleカレンダー「教会員記念日」で、毎朝7時の通知を見る。","【PCで検索・葉書】「▶ 記念日管理システム」（記念日管理Webアプリ起動.bat）を押す。ブラウザで画面が開く（（URL省略））。","画面で日付を指定して、その前後の記念日を検索する。送付先住所の確認・編集、送付除外の設定、対象者一覧の確認ができる。","葉書を作るときは、印刷用ページ・Excel・PDFを作成して印刷する（exportsフォルダに出る）。","終わったら、画面右上の「⏻ 終了」を押してサーバーを止める。","名簿を直した直後にカレンダーへ反映したいときは、「記念日データ手動更新.bat」を実行する。"],"notes":["毎朝のカレンダー更新は daily_update.py が自動で行います。","名簿のマスターは OneDrive\\広島教会\\名簿\\教会員管理ファイル.xlsm です（読み取り専用で使います）。"],"cowork":"","keywords":"記念日 誕生日 バプテスマ 召天 結婚 葉書 はがき ハガキ 印刷 宛名 通知","folder":"20_claude_anniversary_maneger","guide":"葉書印刷はWebアプリの画面から行うと思われます（要確認）"},{"id":"21","kind":"system","label":"21番","name":"説教字幕システム","category":"説教/配信","status":"低頻度（礼拝時のみ）","desc":"説教のリアルタイム音声認識字幕","overview":"礼拝の説教を、リアルタイムの音声認識で字幕にして会堂のスクリーン（OBS経由）に映すシステムです。ボランティアスタッフ向けの当日運用マニュアル（HTML）があります。使うのは礼拝時のみです。","steps":["【前日〜当日朝】説教原稿を操作パネルにドラッグ＆ドロップで登録する。Canvaのスライドもいつも通り準備する。","【礼拝前】PCとプロジェクターの電源を入れ、Win+Pで画面を「拡張」にする。OBSを起動する。","「▶ 説教字幕システム」（デスクトップの「説教字幕システム（執務室・簡易起動）」）を押す。黒い画面で入力モード（USBマイク等）を選ぶ。","自動で開く操作パネルで「要約／そのまま」などの設定を選ぶ（必要なら原稿を更新）。","OBSで「礼拝」シーンを選び、OBSの画面を右クリック→「全画面プロジェクター」でプロジェクターに出す（OBSを起動するたびに毎回必要）。Canvaは全画面プレゼンテーションにする。","【礼拝中】説教が始まったら Ctrl+Shift+S で字幕スタート、終わったら Ctrl+Shift+E でストップ。","【礼拝後】プロジェクター側でEscを押し、黒い画面とOBSを閉じる。"],"notes":["OBSに字幕が映らないときは、OBSの設定で「ブラウザのハードウェアアクセラレーション」のチェックを外して再起動します。","くわしい手順は フォルダ内の「礼拝当日の運用マニュアル.html」を開いてください。"],"cowork":"","keywords":"説教 字幕 音声認識 礼拝 スクリーン","folder":"21_claude_LiveSermonCaptions","guide":""},{"id":"22","kind":"system","label":"22番","name":"議事録 資料と宛先の管理","category":"総務/会議","status":"稼働中（2026-10-22 文字起こしエディタを追加）","desc":"執事会等の議事録作成","overview":"執事会などの会議の議事録を、ほぼ自動で作るシステムです。スマホのGoogleレコーダーで録音・文字起こしし、専用のGmailアドレス宛に送ると、PC側が受け取って議事録のWord原案を作り、確認メールをあなたに送ります。「OK」と返信すると、校正担当者に本番メールが送られます。","steps":["会議を、スマホ（Pixel 6a）のGoogleレコーダーで録音し、文字起こしまで済ませる。","会議後、レコーダーの共有メニューからメールを選び、専用アドレス（（登録済みメールアドレス） の形のエイリアス）宛に送信する（件名は何でもよい）。","PCの電源が入っていれば、PC側が自動で受け取り、会議の種類（執事会／その他）を判定して議事録のWord原案を作る。執事会の場合は、最新のアジェンダや過去の議事録も参照される。","確認メール（Wordを添付）があなた宛てに届く。内容を確認し、よければ「OK」を含む返信を送る。","承認すると、校正担当者へ本番のメールが自動送信される。","資料（総務部報告など）を追加したい／宛先を直したいときは、「▶ 議事録_資料と宛先の管理」を押す。宛先管理タブで校正担当者のメールを編集し、資料アップロードタブで補助資料をドラッグ＆ドロップする。"],"notes":["PCの電源が切れていると処理は遅れますが、データは失われず、PC起動後に処理されます。","生成した議事録は minutes フォルダに保存され、執事会の分はOneDriveの「2026年執事会」フォルダにもコピーされます。","Coworkに「議事録を作成して」と頼む手動の方法（church-minutes スキル）も使えます。広島市キリスト教会連盟の役員会は33番です。","【文字起こしエディタ（2026-10-22 追加）】文字起こしテキスト（txt）をブラウザで直す小さなエディタ。22番フォルダの「文字起こしエディタ.bat」から起動（txtをこのbatにドラッグしてもよい）。直した内容は2秒ほどで自動保存され、最初の保存の前に元ファイルを「差替前」フォルダへ退避する。開いた後に外から変わっていたら上書きせず警告。ブラウザを閉じると約3分で終了。止めるときは「文字起こしエディタ_停止.bat」。"],"cowork":"議事録を作成して","keywords":"議事録 執事会 会議 宛先 文字起こし エディタ 文字起こしエディタ 差替前 自動保存 Gemini","folder":"22_claude_church_meeting_minutes","guide":""},{"id":"23","kind":"system","label":"23番","name":"撮影時 音声命名アプリ","category":"写真","status":"開発中/低頻度","desc":"撮影時に音声でファイル名を付けるAndroidアプリ（開発中）","overview":"撮影のその場で音声入力して、写真のファイル名を「yymmdd_名前.jpg」に決めて保存するAndroidアプリ（開発中）です。普段の写真は標準カメラのまま、名前を付けたい場面だけこのアプリで撮ります。","steps":["現在は開発中のため、利用者向けの起動手順はありません。","開発の続きはVS CodeのClaude Codeで行う（デスクトップの「Android Studio」は開発用）。","完成後は、アプリを起動→撮影→音声で名前を言う→確認・修正して「決定」→保存、という流れになる予定。"],"notes":["仕様は photo-naming-app-spec.md にまとまっています（同名のときは末尾に _001 を付ける、高画質／省容量の選択、など）。"],"cowork":"","keywords":"写真 命名 音声 Android アプリ","folder":"23_claude_photo_naming_app","guide":"開発中のため利用者向けの起動はありません"},{"id":"24","kind":"system","label":"24番","name":"名刺管理","category":"名簿/連絡","status":"稼働中（新規構築中）","desc":"名刺管理システム","overview":"名刺の写真を撮ってスマホから送るだけで、会社名・氏名・住所・電話・メールなどをデータ化して管理するシステムです。AI（Gemini）が名刺の文字を読み取り、PCの画面で確認・修正してから確定すると、Googleスプレッドシートに登録されます。登録した名刺は、スマホのAppSheetアプリで一覧・検索・電話やメールのワンタップ操作ができ、名刺画像も見られます。","steps":["【スマホで】名刺をスマホのカメラで撮影する。","写真アプリから「共有」→ Googleドライブの「G:\\マイドライブ\\同期データ\\名刺画像スマホ連携」フォルダに保存する（数枚たまってからまとめてでもよい）。","【PCで】Googleドライブがパソコンと同期されていることを確認し、「▶ 名刺取り込み」（デスクトップの「名刺取り込み」／名刺取り込み.bat）をダブルクリックする。","AIが名刺を読み取り、ブラウザに「名刺画像と読み取り結果を並べた確認画面」が開く。見比べながら間違いを直し、受領日（新規は今日が初期値）を確認する。","「確定」を押すと、Googleスプレッドシート「名刺管理」に1名刺1行で追記され、画像は「名刺画像（保存用）」フォルダへ移動する（受信フォルダから消えるので二重登録されない）。","【スマホで確認】AppSheetアプリを開くと、受領日の新しい順の一覧・検索・詳細（名刺画像、電話・メール・地図のワンタップ）で見られる。"],"notes":["読み取りに失敗して項目が空欄になったもの（1日のAPI上限超過など）は、「名刺_再OCR.bat」を実行すると、空欄のものだけやり直せます。","PCの起動時に、未処理の名刺画像が受信フォルダに残っていると「新規名刺が◯件あります」と通知が出て、「確認する」で取り込みを始められます。"],"cowork":"","keywords":"名刺 OCR 取り込み 名簿","folder":"24_claude_buis_card_management","guide":""},{"id":"25","kind":"system","label":"25番","name":"定期総会資料の更新","category":"総務/会議","status":"稼働中","desc":"定期総会資料の差分更新","overview":"定期総会の資料を、前年のものから変更点だけを更新して作るCoworkスキルです。活動報告（ANN-REP）や教勢データ（CH-STATS）のExcelを元にします。","steps":["Claudeアプリ（Cowork）を開く。","「総会資料を更新して」と話しかける。","Claudeの質問に答える。ANN-REP（2026年度主な行事と活動報告.xlsx）とCH-STATS（2026年度教勢データ.xlsx）のExcelが参照される。","出てきた更新案を確認し、必要なところを直してもらって仕上げる。"],"notes":["元の資料は、このフォルダの REF-SRC に置かれています。"],"cowork":"総会資料を更新して","keywords":"総会 資料 定期総会 差分","folder":"25_claude_AGM-REP","guide":""},{"id":"26","kind":"system","label":"26番","name":"週報メール文作成","category":"週報資料","status":"稼働中","desc":"週報配信前の案内メール作成","overview":"週報を配信する前に送る「週報事前メール（ピタゴラ連絡網）」の文面を作るツールです。今回の発信予定日などを入れて、文面の下書きを作ります。","steps":["「▶ 週報メール文作成」（main.pyw）を押す。31番の「週報の一連作業」から呼ぶと、画面の一番上に「今回の週報：10月18日・25日」のように表示される。","今回の発信予定日などを確認する（今日の日付が初期値）。","文面を確認し、牧師が自分で書き換える（本文には日付は自動で入らない）。","仕上がった文面をメール等にコピーして配信する。"],"notes":["詳しい仕様は「週報メール配信ツール_仕様書.md」にあります。","Excelを開いたままでも、読み込み・新規保存・最新行の更新ができます（開いていれば、そのExcelに直接書いて保存）。ただし未保存の変更があると中止するので、保存してから実行します。"],"cowork":"","keywords":"週報 メール 配信 案内 事前","folder":"26_claude_pre-bulletin-mail","guide":""},{"id":"27","kind":"system","label":"27番","name":"AI秘書（索引）","category":"基盤","status":"稼働中","desc":"このAI秘書の索引・ランチャーの作業フォルダ","overview":"このAI秘書そのものの作業フォルダです。「これはどこでやってる？」「どうやってやる？」に答える索引（index.md）と、このランチャーのデータが入っています。","steps":["このランチャーを開く（デスクトップの「AI秘書ランチャー」）。検索欄に「葉書」「週報」などを入れて、やりたい作業を探す。","各カードの「システム概要」で、何をするものか・手順を確認する。▶ボタンで起動、「フォルダを開く」でフォルダを開く。","新しい仕組みを足したときは、Coworkに「新しい仕組みを記録して」と話しかけ、「インデックス更新して」で索引を最新にする。","説明や手順を直したいときは、launchers.json の該当項目の overview・steps・notes を書き換える（またはClaudeに頼む）。"],"notes":["ショートカットは create_shortcut.ps1 を右クリック→「PowerShellで実行」で作れます。"],"cowork":"これはどこでやってる","keywords":"秘書 索引 ランチャー 一覧","folder":"27_claude_AI_secretary","guide":""},{"id":"28","kind":"system","label":"28番","name":"Outlook返信下書き","category":"総務/メール","status":"稼働中","desc":"Outlook返信下書き・過去メール複製下書きの作成（送信はしない）","overview":"Outlookのボタン1つで、過去メールを参考にした返信の下書き、または前回メールを丸写しした定型メールの下書きを作るシステムです。送信は絶対にしません。下書きを作るところまでで、確認と送信は自分で行います。対象は （登録済みメールアドレス） のアカウントです。","steps":["【返信の下書き】Outlookの受信トレイで、返信したいメールを選択する。","クイックアクセスツールバーのボタン「CreateReplyDraft」を押す。","過去にその相手へ送った最も近いメールが丸写しされ、今回直す箇所だけが黄色ハイライトの下書きが作られて開く。黄色の箇所を直して、内容を確認して送信する。","【前回と同じ形式のメール（月次報告など）】Outlookの検索で、複製したい過去のメールを探して選択する。","ボタン「CreateReferenceDraft」を押し、入力欄が出たら何も入力せずOKを押す。","宛先・件名はそのまま引き継がれ、本文は前回のまま、今回変わる箇所だけ黄色の下書きができる。黄色を全部直せば完成。送信前に宛先欄を必ず確認する（食い違いがあると警告が出る）。"],"notes":["入力欄に「あいあいねっとへの前回の報告メールを複製して」のように書くと、AIが探してくれますが、見つからないこともあるので、検索して選ぶ方法がおすすめです。","黄色の箇所には、時候の挨拶や「第◯回」も含まれます。書き換えが正しいか確認してください。"],"cowork":"","keywords":"Outlook アウトルック 返信 メール 下書き","folder":"28_claude_AI_outlook_mail_assistant","guide":"Outlookに組み込んだVBAマクロのボタン（CreateReplyDraft / CreateReferenceDraft）から実行"},{"id":"29","kind":"system","label":"29番","name":"週報QR掲示用","category":"週報資料","status":"稼働中","desc":"週報掲示用QRコード作成＋掲示用Wordマクロ起動","overview":"週報の掲示用QRコードを作り、掲示用のWord（本日の週報のQRコード_掲示用.docx）を作成・印刷するシステムです。週数の上限はなく、毎回上書きされます。31番「週報の一連作業」からも呼ばれます。","steps":["「▶ run.bat」（デスクトップの「週報QR掲示用」）を押す。","①の欄に、週報PDFの共有URL（例：（URL省略））を貼り付け、「QRコード作成・保存」を押す。必要な週の分だけ繰り返す。","②に今日以降の週のQRが並ぶ。掲示する週にチェックを入れて（今作った週は自動でチェックされる）、「掲示用Wordを作成」を押す。","「Wordを開く」で内容を確認し、よければ「印刷する（既定のプリンター）」で印刷する。"],"notes":["掲示用WordをWordで開いたままでも「作成」できます（自動で閉じて作り直し、開き直す）。ただし未保存の変更があると中止するので、保存してから「作成」を押します。","保存先：OneDrive\\広島教会\\広島教会礼拝\\家庭礼拝\\週報事前メール配信。同じ週を作り直すとQR画像は上書きされます。"],"cowork":"","keywords":"週報 QR 掲示 Word マクロ","folder":"29_claude_bulletin_qr_word_file_maker","guide":""},{"id":"30","kind":"system","label":"30番","name":"HP（WordPress）更新","category":"HP/Web","status":"稼働中","desc":"WordPress固定ページ（週報PDF・YouTube等）更新","overview":"教会のホームページ（WordPress）の固定ページを、ポップアップ画面から更新するシステムです。毎週の週報PDFと礼拝配信（YouTube）のリンクの差し替えのほか、祈祷会ビデオと教会員情報ページにも対応します。更新前にページのバックアップを取り、変更案を確認・承認してから反映します。","steps":["「▶ run.bat」（ポップアップ画面）を押す。","更新する内容を選ぶ：①週報・礼拝配信／②祈祷会／③教会員情報。（直前の更新を取り消すボタンもある）","①の場合：日付を指定し、HP素材フォルダの週報PDFとYouTubeのURLが使われる。②の場合：祈祷会のmp4をYouTubeにアップロードし、HPにリンクが付く。","変更案（差分）が表示されるので、内容を確認する。","問題がなければ承認して反映する。更新前のページ原本は backup フォルダに保存されている。"],"notes":["毎週の週報作業は、31番から呼び出すのが基本です。","Claude Codeと対話しながら操作したいときは「run_claude.bat」を使います。","WordPress接続のパスワードなどは .env にあり、共有しないでください。"],"cowork":"","keywords":"WordPress HP ホームページ 更新 週報 祈祷会 YouTube","folder":"30_claude_wordpress_page_update","guide":"ポップアップ画面から更新。Claude Code対話用は run_claude.bat"},{"id":"31","kind":"system","label":"31番","name":"週報の一連作業","category":"週報資料","status":"稼働中","desc":"PDF化→HP掲載→QR・掲示用Word→週報メール文・英訳を順に進める","overview":"週報の一連の作業（PDF化 → HP掲載 → QR・掲示用Word → 週報メール文・英訳）を、上から順にボタンを押すだけで進められる「進行役」のシステムです。複数週をまとめて進められます。","steps":["「▶ 週報の一連作業」（デスクトップのショートカット、run.bat）を押す。","画面1：作業する週を選ぶ（状態：未PDF化／HP未掲載／修正あり／差し替え待ち、などが出る。「HP掲載済みの週も表示する」で過去分も出せる）。","画面2（進行表）：上から順にボタンを押す。①PDF化（2番）→ ②HP掲載（30番）→ ③QRと掲示用Word（29番）→ ④週報メール文（26番）・英訳 の順。","HP掲載・差し替えでは変更案の画面が開く。内容を確かめて、「承認して反映」を押したときだけHPが変わる。","下の「記録」欄に、各ツールの出力が流れる。うまくいかない工程があれば、その表示を見て対処する。"],"notes":["PDFを作り直した週は「修正あり」→「差し替え待ち」と進み、差し替えモードで置き換えます。","相手側の手直しがまだの工程は、「○番の手直しがまだ」と出るだけで何も起きません。","ショートカットを作り直すときは create_shortcut.ps1 を右クリック→「PowerShellで実行」。","週報原稿をWordで開いていて読めないときは、「未完成」として一覧から外し、画面1にその理由を出します（誤ってPDF化・HP掲載されないため）。原稿を保存して閉じると、一覧に出ます。"],"cowork":"","keywords":"週報 一連 流れ 進行 PDF HP QR メール 英訳 毎週","folder":"31_claude_bulletin_weekly_flow","guide":""},{"id":"32","kind":"system","label":"32番","name":"クリスマスカード宛名印刷","category":"名簿/連絡","status":"稼働中（年1回）","desc":"はがき宛名面の印刷（エプソン PX-105、年1回）","overview":"クリスマスカードの宛名面（郵便番号・住所・氏名）だけを、エプソンPX-105で印刷するシステムです。年に一度の作業で、20番の記念日葉書と同じ形のはがきを使います。名簿は読み取るだけで、書き換えません。","steps":["「▶ クリスマスカード宛名印刷_起動.bat」をダブルクリックする。ブラウザに画面が開く。","名簿を最新にする（起動時に自動で読み込む）。Excelで名簿を開いたままだと読めないので、警告が出たらExcelを閉じて「名簿を読み込み直す」を押す。","「要確認」（住所が変わった人・空欄の人）を絞り込んで片付ける。","会員以外の宛先を「＋ 会員以外の宛先を追加」で足す。郵便番号は7桁数字で入れ「住所を入れる」を押すと地名まで入る。出さない人は「今年出す」のチェックを外す。","画面の一番下で、「位置合わせ用PDF」を普通紙に印刷して、はがきと重ねて透かして確認する。ずれていたら数値（mm）で補正する。","「出す対象すべてのPDFを作る」（または「未印刷だけ」）でPDFを作り、はがきサイズ（100×148mm）・倍率100%でPX-105に印刷する。","印刷できたら、画面上部の赤い帯の「印刷済みにする」を必ず押す。失敗したときは「印刷しなかった（取り消し）」。","終わったら右上の「⏻ 終了」を押す。"],"notes":["毎年の手順は、フォルダ内の「使い方.md」にも書かれています。","データは data フォルダに保存され、壊れたときは backup から戻せます。"],"cowork":"","keywords":"クリスマス カード 宛名 葉書 はがき ハガキ 印刷 年賀","folder":"32_claude_christmas_card_private","guide":"使い方.md に毎年の手順があります"},{"id":"33","kind":"system","label":"33番","name":"広島市キリスト教会連盟 役員会アシスタント","category":"総務/会議","status":"稼働中（2026-10-22 第二回定例役員会で議事録整形・報告作成まで実運用）","desc":"連盟の定例役員会のアジェンダ作成（日誌から報告を抽出）・議事録の整形・修正・報告（1ページ）の作成","overview":"広島市キリスト教会連盟の定例役員会（年3回：5月・10月・2月）の、アジェンダ作成・議事録の整形/修正・報告（A4・1ページ）の作成をするシステムです。あなたが手直しした部分は消えないように保存されます。","steps":["「▶ 起動」（デスクトップの「連盟役員会アシスタント」）を押す。3つのタブの画面が開く。","【① アジェンダを作る】回・日付・時刻・会場を確認する。「イレギュラーな議題・補足事項」があれば書く。「アジェンダを作成する」を押す。日誌のF列（連盟・県宗教連盟の行）が報告の下書きになる。画面下の「確認してください」を読む。","【② 議事録を整形・修正する】役員会フォルダにある議事録（自分で微修正した最終形）を選び、「議事録を整形する」で同じ名前に上書き整形する。直したい所があれば文章で書いて「指示どおり修正する」。","【③ 報告を作る】議事録を選び、「報告を作成する」で、A4・1ページに収まる報告ができる。","成果物は OneDrive\\広島教会\\広島市キリスト教会連盟\\役員会 に保存される（このフォルダにもコピー）。"],"notes":["自分でWordを手直ししたあとで再保存しても、手直しした段落は残ります（同じ段落をシステムも変えた場合は「_v2」で別保存）。上書き前の元ファイルは backup に残ります。"],"cowork":"","keywords":"連盟 キリスト教会連盟 役員会 アジェンダ 議事録 報告 市連盟 整形 広島市キリスト教会連盟 県宗連","folder":"33_claude_hiroshima_church_convention_agenda","guide":"画面の3つのタブ（①アジェンダ ②議事録の整形・修正 ③報告）から操作。手直しした部分は消えません（backupに元ファイルを退避）"},{"id":"34","kind":"system","label":"34番","name":"週報ベース作成","category":"週報資料","status":"稼働中","desc":"選んだ日曜の週報のベース（固定内容・追記は黄色）を作る。月末の日曜なら次月フォームも作る","overview":"週報の最初のベースを作るシステムです。差し込みExcelの値を固定化し、今週の予定は牧師報告と定例ルールから作り、報告欄は期日切れの削除・日付の更新・過去年度の同時期の候補追記をします。追記・更新・未入力は黄色のハイライトです。","steps":["デスクトップの「週報ベース作成」を押す。今日以降の日曜の一覧が出る。","ベースを作りたい日曜にチェックを入れ、「→ 選んだ週のベースを作る」を押す。選んだ週の誕生日・バプテスマが名簿（現在会員）から差し込みExcelに更新される。","2026年度フォルダに「週報原稿 YYYYMMDD.docx」ができる。黄色の部分を確認し、手作業で仕上げてハイライトを消す。","その月の最後の日曜を選ぶと、次月の「週報原稿 YYYYMMDD＿フォーム.docx」が作業フォルダにも作られる。"],"notes":["黄色のハイライトが残っている原稿は、31番（週報の一連作業）の一覧に出ません。","既にある週は上書きしません（「作り直す」を選ぶと元ファイルを「作り直し前バックアップ」へ退避）。","差し込みExcelの更新前の版は「差し込みデータ_バックアップ」に残ります。年度替わりは settings.json とExcel・フォルダを新しくします。詳細はフォルダの README.md。","差し込みExcel・名簿・説教箇所リスト・週報原稿を開いたままでも、ベース作成と作り直しができます。ただし未保存の変更があると中止するので、保存してから実行します。","3ページ目の説教要旨の箱は、ベース作成・次月フォーム作成のたびにページ下端まで自動で広がります（2026-10-20）。囲みが残る週はログに「囲みあり」と出るので、要旨を入れる前に箱を縮めます。"],"cowork":"","keywords":"週報 ベース 週報原稿 フォーム 差し込み 予定 報告欄 ハイライト 黄色 次月 誕生日 バプテスマ 牧師報告","folder":"34_claude_bullein_preparration","guide":"日曜にチェック→「選んだ週のベースを作る」。黄色の部分を確認・修正し、消すと31番の一覧に出る"},{"id":"35","kind":"system","label":"35番","name":"佐々木さんを支援する会 世話人会アジェンダ作成","category":"総務/会議","status":"稼働中","desc":"世話人会（第一〜三回・臨時）のフォルダ作成・前回以降の議事録まとめ・アジェンダ作成","overview":"「佐々木さんを支援する会」世話人会（定例の第一回5〜6月／第二回10〜11月／第三回2〜3月、および臨時）のアジェンダを作るシステムです。日付入りの会議フォルダを作り、前回の定例会以降の議事録を原文のまま1つのWordにまとめ、前回アジェンダの書式（ロゴ・MS明朝・議案の書き方）でアジェンダを作ります。議事録は文字起こしから別途作るため、ここでは作りません。","steps":["「▶ 起動.bat」（デスクトップの「世話人会アジェンダ作成」）を押す。最新の議事録の「次回会議」から種別・開催日・時間・場所が自動で入る。","種別（第一回／第二回／第三回／臨時）・開催日（例 2026-11-16）・時間・場所・出席を確認し、違えば直す（既定は大井バプテスト教会（対面）と世話人6名。Zoomなどのときは書き換える）。","「前回以降の議事録」にまとめる議事録の候補を確認する（既定は直近の定例会〜開催日の前日。Ctrlクリックで増減）。","必要なら「今回特有の議題・補足」を書き、「アジェンダまで作成する」を押す（数分かかる）。","画面下の「確認してください」を読み、Wordのアジェンダを開く。取り上げるか微妙な議案は黄色なので、確認して不要なら削除し、必要ならマーカーを外す。","できあがったアジェンダを直したいときは、「④ 作り直しの要望」に書いて「④の要望で作り直す（上書き）」を押す（Wordで手直しした内容を基に、要望に関係しない部分は残して上書き。元は backup に退避）。"],"notes":["保存先は OneDrive\\広島教会\\佐々木さんを支える会\\世話人会6年度_第二回世話人会_261116 のような日付入りフォルダ（臨時は 2026年度_臨時世話人会_YYMMDD）。アジェンダ・前回以降の議事録まとめ・アジェンダ作成メモが入る。","同名のアジェンダを作り直すときは確認のうえ上書きし、元は backup に退避します。雛形は template\u0007genda_template.docx（前回アジェンダ）。","ウブムエの号のフォームは Cowork の ubumue-form-builder スキルです。"],"cowork":"","keywords":"佐々木さんを支援する会 支援会 世話人会 アジェンダ 議事録 臨時世話人会 フォルダ 前回以降 ハイライト","folder":"35_claude_sasaki_Support Committee_agenda","guide":"種別・開催日を確認→議事録の候補を確認→「アジェンダまで作成する」。取り上げるか微妙な議案は黄色"},{"id":"36","kind":"system","label":"36番","name":"個人カード請求書作成","category":"家計/個人","status":"稼働中","desc":"auPAYの利用履歴から、妻への個人カード使用請求書（月別シート）を作成","overview":"auPAYアプリの利用履歴（スマホでコピーしてGoogleドライブの Aupay_明細_inbox に保存したテキスト）から、妻に請求する「播磨家 個人カード使用請求書」（OneDrive\\広島教会\\harima\\個人カード清算\\2026年度_個人カード請求書.xlsx の月別シート）を作るシステムです。ポイント・残高チャージ・0円は自動で除き、店名は過去シートと同じ呼び名・費目に直します。教会用など請求しない分は「除外」にし、現金払いは画面から手入力します（店名の一部を入れると候補が出ます）。","steps":["スマホのauPAYアプリで「利用履歴」の該当月を全文コピーし、Googleドライブの「Aupay_明細_inbox」にテキストファイルで保存する（ファイル名は「10月 …」のように月で始める。履歴が増えたら、重複してよいので全文を新しいファイルとして保存し直す。同じ月は更新日時が最新の1つだけを使う）。","デスクトップの「個人カード請求書作成」を開く（ツールを開いたまま履歴を足したときは、開き直すか「期間を反映して履歴を読み直す」を押す）。","表を確認する。黄色の行は要確認（店名・適用を直す）。教会用など請求しない行は「請求」欄をクリックして「除外」にする（除外はその行だけ記憶。店ごとの自動除外はしない）。","現金払いなどは、下の手入力欄に店名の一部を入れて候補を選び、金額を入れて「追加」（日付は空欄なら今日）。間違いは行を選んで「選択行を更新／削除」で直せる。日付順に並ぶ。","「Excelに反映」を押すと請求書のシートに書き出される（何度でも可。書き換え前のファイルは data\\backup に自動保存）。","締切日（毎月25日の前日。25日が土日祝のときは、その前の平日の前日）までに完成したら「〇月分を確定して翌月のシートを作る」を押す。確認画面で「はい」を選ぶと、その月分を既定のプリンターにA4で印刷してから確定する（「いいえ」＝印刷せずに確定、「キャンセル」＝何もしない）。確定したときだけ翌月の空のシートができる。","確定せずに印刷だけしたいときは「印刷（既定のプリンター・A4）」を押す（画面に出ている月が印刷される。確定後は翌月に切り替わるので、10月分は確定の前に印刷される）。"],"notes":["取り込み範囲は、前回の締切日の翌日〜今回の締切日（画面上部で直せる）。締切日より後の日付の履歴は、確定後に作る翌月分に入る。","Excelを直接直してもよい（追加・修正は残り、消した行は復活しない）。請求書のExcelを開いたままでも、書き込み・月の確定・印刷・年度替わりができる。ただし未保存の変更があると中止するので、保存してから「Excelに反映」などを押す（印刷だけは止めず、保存済みの内容を印刷する）。","練習は `python main.py --test`（test_data のコピーだけを使う）。使い方は 36番フォルダの README.md。"],"cowork":"","keywords":"個人カード 請求書 aupay au pay 利用履歴 明細 妻 請求 家計 精算 現金 締切 立替","folder":"36_claude_personal_expenses","guide":"履歴をDriveに保存→ショートカットを開く→教会用などを除外→現金払いを手入力→Excelに反映→締切前に「〇月分を確定」（確定と同時に印刷）"},{"id":"37","kind":"system","label":"37番","name":"日誌の自動記入（手動実行）","category":"総務/日誌","status":"稼働中（2026-10-11 本番初回書き込み確認済み・自動起動登録済み。2026-10-24 メールからの追記ボタンを追加・本番確認済み）","desc":"日誌（2604日誌.xlsm）の未記入日について、定型・牧師報告・Googleカレンダー・過去2年の同行事から候補を出し、採用したものだけを記入する（明日の分も作れる）","overview":"日誌（2604日誌.xlsm）に記入のない日があれば、候補を集めて1日ずつ表示し、採用したものだけを日誌の末尾の行へ書き込むシステムです。ログオン時・ロック解除時・毎日6時にタスクスケジューラ（DiaryAutoFill）から自動で起動します（未記入日が無ければ何も出ません）。デスクトップの「日誌自動記入（手動実行）」は手動で起動するもので、「明日の分も作る」を選べます（本番の日誌に書き込みます）。候補は、曜日などの定型（rules.json）、牧師報告（Word）の予定、Googleカレンダー（（登録済みメールアドレス）・読み取りのみ）の予定、昨年・一昨年の同じ時期の行事（初期は不採用）です。流用して書き換えが必要な部分（日付・時刻・人数など）は赤字になります。日誌の行の挿入・削除はせず、他のツールが使う数式（B/D/I列・作業フィールド）には触れません。","steps":["自動起動で画面が出たとき、または「日誌自動記入（手動実行）」を開く。","日付ごとに候補が1日ずつ出る。採用するものにチェックを入れる（定型・牧師報告・カレンダーは初めからチェック済み、昨年・一昨年は未チェック）。明日の分も作りたいときは「明日の分も作る」にチェックを入れる（手動のとき）。","「採用した○件を記入して次へ」で日誌の末尾に書き込まれる（0件なら日付だけの行）。記入しない日は「この日は記載しない（スキップ）」、あとで決めるなら「この日は保留して次へ」。×で閉じた日は保留で、次回また出る。","日誌を開き、赤字の部分を実際の内容に書き直す。先の日が記入済みで日付順が崩れる場合は警告が出る（末尾に書かれるので、必要なら行の挿入を手作業で行う）。"],"notes":["【メールから追記】Outlookで、日誌に残したい部分をマウスで選び Ctrl+C でコピー → 左上のクイックアクセスの「日誌へ」ボタン → 確認窓で要約案（テーマ・対象・内容250字以内・備考・日付）を直して「日誌に書く」。日誌を開いたままで末尾に追記され、E列が薄い黄緑になる（I列を「済み」にすると消える）。メールには緑の分類「日誌」が付く（赤フラグには触れない）。日誌が編集中で書けないときは待機リストに入り、次に「日誌へ」を押したときに続けて書かれる。ボタンの中身は 37番の outlook_vba\\DiaryButton.bas（Outlookの Alt+F11 でインポート済み）。使い方・仕様は 37番の README.md「メールから日誌へ追記」・SPEC.md。","使い方・設定・困ったときは 37番フォルダの README.md。定型の一覧は rules_view.html（rules.json から自動生成）。定型の追加・変更はClaudeに頼むか rules.json を直す。","書き込み前に backup フォルダへ日誌のコピー（直近30件）が自動保存される。経過と採用／不採用の履歴は log.txt。","日誌をExcelで編集中などで書けなかったときはお知らせが出て、次回起動で再表示される。","主日礼拝の来会者・合計・説教者は前週分をコピーせず、赤字の仮置きになる（来会者リスト作成ツールが読むため）。","自動起動の登録・削除は 37番フォルダの register_task.ps1（-DryRun で内容確認、-Remove で削除）。デスクトップのショートカットは create_shortcut.ps1 を右クリック→「PowerShell で実行」で作る。","将来の案（夕方に明日分を自動提示 など）は FUTURE.md。","ツールが書いた行は、E列（テーマ）が薄い青。I列を「済み」にすると青は消える。書く本文は、直近の同じテーマの行のG列のコピー（数字・日付などは赤字）。","前日のI列が未済（黄色）の行は【持ち越し】候補として出る（初期は採用）。採用すると、前日の行が「済み」になり、備考に「○月○日」が追記される。主日礼拝・祈祷会・ホームレス支援・外部面接は持ち越さない。"],"cowork":"","keywords":"日誌 自動記入 未記入 遅れ分 定型 牧師報告 カレンダー 昨年 一昨年 赤字 ポップアップ 2604日誌 毎日 記入 起動時 メール 日誌へ追記 日誌へ ボタン Outlook 要約 分類 黄緑","folder":"37_claude_diary_auto_fill","guide":"Outlookのメールから追記するときは、選んだ部分をコピーして「日誌へ」ボタン。自動起動（ログオン時・ロック解除時・毎日6時）で候補が出る。手動は「日誌自動記入（手動実行）」→日付ごとに採用／不採用→「採用分を記入して次へ」（書き換えが必要な部分は赤字）"},{"id":"38","kind":"system","label":"38番","name":"配布写真の自動整理","category":"写真","status":"稼働中","desc":"生活支援物資配布の写真を、保存するだけで自動で縮小・改名し、「配布写真」の月フォルダへ入れる","overview":"毎月第三日曜の生活支援物資配布の写真（メールで届くスマホの高解像度画像）を、photo_inbox に保存するだけで自動整理するシステムです。長辺1280pxに縮小し（向き補正・位置情報の削除つき）、「YYMMDD_生活支援物資配布_写真 (N).jpg」の名前に改め、月のフォルダにまとめて、元の「配布写真」フォルダへもフォルダごとコピーします（コピー済みの記録つき。コピー先で消した・付け替えた写真は戻りません）。木目のテーブルに食品を真上から並べた「基本セット」の写真は自動で1番にします。保存後、photo_inbox の元画像は削除されます。","steps":["メールで届いた写真を、このフォルダの「photo_inbox」に保存する（フォルダを開くボタンから開ける）。活動日の前に届く写真も、当日の活動後に追加される写真も同じ。","常駐監視（watcher）が動いていれば、保存するだけで自動処理される。動いていないときは「▶ run.bat」を押して実行する。","処理が終わると小さな通知ウィンドウが出る（30秒で自動で閉じる）。「1番は〇〇です」と表示されるので、基本セットの写真が選ばれているか確認する。違っていたら、元の「配布写真」フォルダ内で名前を付け替える（付け替えても、元の名前の写真は戻らない）。","月のフォルダ「YYMMDD_生活支援物資配布_写真」が、このフォルダの output と、OneDrive の「配布写真」の両方にできる。","活動後、日誌が保存されて写真がそろったら、Claudeアプリで「あいあいねっとへの報告を作成して」と話しかける（報告は Coworkスキル aiainet-report）。"],"notes":["配布日は第三日曜。「今日−2日」以上で最も近い第三日曜の月に入る（当日夜や翌日に届く写真もその月）。ファイル名が6桁の日付（YYMMDD）で始まるときは、その日付を優先する。","2回目以降（後出しの写真）は、番号の続きから付く。1番がすでにあれば、新しく決め直さない。基本セットらしい写真が見つからないときは、届いた順に番号を付け、通知とログに残る。ファイル名に「基本」を含めておくと、その写真を必ず1番にする。","コピーは「コピー済みの記録」（copied_log.json）で管理する。元の「配布写真」フォルダで写真を消したり、名前を付け替えたり、手で足したりしても、元には戻らない。同名ファイルは上書きせず、コピー先のファイルは消さない。コピーに失敗した写真（年度フォルダが無い・OneDriveの不調など）だけは、記録されず、次の実行で補われる。","ある月の写真をコピー先に戻したいときだけ、38番フォルダで `py -3 organize_photos.py --recopy 260920`（YYMMDD）を実行する（コピー先に同名が無い写真だけが戻る。番号を付け替えた月に使うと、元の名前の写真が重複して戻る）。output と copied_log.json は消さない。","年度（4月始まり）が替わったら、OneDrive に新年度の「…\\{年度}年度\\5つのパンと2匹の魚班\\配布写真」フォルダがあるか確認する（無いとコピーされず警告が出る。作ってから run.bat を実行すると未コピー分がコピーされる）。","処理できなかった写真は photo_error に移る。原因は organize_log.txt。使い方は 38番フォルダの README.md。"],"cowork":"","keywords":"配布写真 生活支援物資 配布 写真 縮小 リサイズ 改名 命名 基本セット 1番 フードバンク あいあいねっと 第三日曜 photo_inbox 活動報告","folder":"38_claude_distribution_photo_organizer","guide":"メールの写真を photo_inbox に保存するだけ（常駐監視が動いている場合）。動いていないときは run.bat を実行"},{"id":"39","kind":"system","label":"39番","name":"執事会アシスタント","category":"総務/会議","status":"稼働中（2026-10-22 実装・11月分で試運転）","desc":"毎月の定例執事会のアジェンダと牧師報告を、前回文書の書式を土台に作る（候補を採用／却下／保留で選び、作成・修正・校正して確定保存）","overview":"毎月の定例執事会の①アジェンダと②牧師報告を作るシステムです。前回の文書の書式・順番・文体を土台に、前回継続審議・宿題・過去の傾向・日誌（「執事共有」）・牧師通常連絡から候補を出し、あなたが採用／却下／保留を選びます。作成・指示どおり修正・機械チェック・AI校正ができ、確定すると元データのフォルダ（OneDrive\\広島教会\\執事会\\執事会議案・報告\\\u003c年>年執事会）に他と同じ名前で保存します。手直しは消さない方式（段落単位の3者比較）です。33番（連盟役員会）と同じ作り。","steps":["デスクトップの「執事会アシスタント」を開く（二重起動不可。閉じると処理も止まる）。","画面上部で年月と①アジェンダ／②牧師報告を選び［この月を開く］。以前の作業内容があれば復元される。","［1 基本情報］で開催日・時刻・会場・議長・記録・出席・次回日程を確認（第二日曜以外の月は日付を直す）。","［2 候補を選ぶ］［候補を探す］（数分）→1件ずつ採用／却下／保留。却下は次回から出ず、保留は次回も出る。題名・提案・経過説明は右側で直せる。","［3 稟議記録］（アジェンダのみ）［稟議を探す］→結果がアジェンダ末尾に載る。","［4 作成・修正・確定］［作成する］→［下書きを開く］でWordで確認。直したい点は［指示どおり修正する］、［機械チェック］［AI校正］で点検。","［確定して保存する］で元データのフォルダに保存（同名があれば上書き前に backup へ退避）。"],"notes":["確定版の判定は、月・種別ごとに更新日が最新のファイル（「AI」「メモ」を含む名前は除外）。画面右上の［確定版の判定を見る］で確認できる。","下書き（このフォルダの agenda\\ report\\）をWordで手直ししても、次に［作成する］を押したとき手直しした段落は残る。同じ段落を両方が変えた場合は、あなたの版を残しシステム案を _v2 に別保存。","メールの作成・送付、牧師通常連絡への添付、議長・書記への事前確認メールはこのシステムの範囲外。","日誌・牧師通常連絡・Excel・Word は開いたままでも読める（保存前の入力は反映されない）。Googleカレンダーは読み取りのみ。認証が切れたら［カレンダー再認証］。","使い方の詳細は 39番フォルダの 使い方.md。ショートカットは ショートカット作成.ps1 を右クリック→「PowerShellで実行」で作る。"],"cowork":"","keywords":"執事会 アジェンダ 牧師報告 議案 稟議 候補 採用 却下 保留 懇談 確定 校正 月別議題 執事会アシスタント 11月","folder":"39_claude_deacons_mtg_agenda","guide":"「執事会アシスタント」→年月と①アジェンダ／②牧師報告を選び［この月を開く］→候補を探して採用／却下／保留→［作成する］→Wordで確認→［確定して保存する］"},{"id":"101","kind":"system","label":"101番","name":"単発タスク置き場","category":"単発タスク","status":"案件ごと","desc":"単発の制作物置き場","overview":"単発の作業用の置き場です。案件ごとに（task_1〜task_5）の中に、その作業の資料や成果物が入っています。","steps":["「フォルダを開く」を押す。","該当する案件のフォルダ（task_1 など）を開いて、中のファイルを確認する。"],"notes":["目次のようなものはないので、探すときは案件名やファイル名で探してください。"],"cowork":"","keywords":"単発 タスク 制作物","folder":"101_task_field","guide":"案件ごとにフォルダ内を直接確認"},{"id":"201","kind":"system","label":"201番","name":"PDF & Image Snipper","category":"その他（Gemini製）","status":"休止","desc":"PDFの切り出し→PNG変換","overview":"PDFの一部を範囲指定で切り出して、PNG画像にするツールです（Gemini製）。HTMLなので、ブラウザで動きます。","steps":["「▶ PDF & Image Snipper.html」（デスクトップのショートカット）を押す。ブラウザで開く。","PDFを読み込み、切り出したい範囲をドラッグして選ぶ。","PNGとして保存する。"],"notes":["休止中の試作です。"],"cowork":"","keywords":"PDF 切り出し PNG 画像 スニッパー","folder":"201_gemini_pdf_cut_to_png","guide":""},{"id":"202","kind":"system","label":"202番","name":"ビンゴゲーム","category":"遊び（Gemini製）","status":"休止","desc":"ビンゴゲーム（HTML）","overview":"ビンゴゲーム（HTML）です。ブラウザで動く遊びの試作（Gemini製）です。","steps":["「▶ bingo.html」を押す（ブラウザで開く）。","画面の案内に従って遊ぶ。"],"notes":["休止中です。"],"cowork":"","keywords":"ビンゴ ゲーム 遊び","folder":"202_gemini_bingo_game","guide":""},{"id":"203","kind":"system","label":"203番","name":"インベーダーゲーム","category":"遊び（Gemini製）","status":"休止","desc":"インベーダーゲーム（HTML）","overview":"インベーダーゲーム（HTML）です。ブラウザで動く遊びの試作（Gemini製）です。","steps":["「▶ invader.html」を押す（ブラウザで開く）。","画面の案内に従って遊ぶ。"],"notes":["休止中です。"],"cowork":"","keywords":"インベーダー ゲーム 遊び","folder":"203_gemini_invader_game","guide":""},{"id":"204","kind":"system","label":"204番","name":"じゃんけんゲーム","category":"遊び（Gemini製）","status":"低頻度","desc":"じゃんけんゲーム（HTML）","overview":"じゃんけんゲーム（HTML）です。ブラウザで動く遊びの試作（Gemini製）です。","steps":["「▶ gemini…じゃんけん_ゲーム.html」を押す（ブラウザで開く）。","画面の案内に従って遊ぶ。"],"notes":[],"cowork":"","keywords":"じゃんけん ゲーム 遊び","folder":"204_gemini_じゃんけん_game","guide":""},{"id":"S:bulletin-translation","kind":"skill","label":"スキル","name":"bulletin-translation（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"週報の英訳（同レイアウト・4ページ）","overview":"週報（Word）を英訳して、同じレイアウトの4ページのWordファイルとして出力するCoworkスキルです。","steps":["Claudeアプリ（Cowork）を開く。","「週報を英訳して」または「9月20日の週報を英訳して」と話しかける（日付だけでも、OneDriveのフォルダから週報を探してくれる）。","出来上がった英訳のWordを確認し、必要なら直してもらう。","印刷する（31番の進行表にも英訳の項目がある）。"],"notes":[],"cowork":"週報を英訳して／9月20日の週報を英訳して","keywords":"週報 英訳 英語 翻訳 英文","folder":"","guide":""},{"id":"S:sermon-draft","kind":"skill","label":"スキル","name":"sermon-draft（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"説教草稿Wordの作成","overview":"説教の草稿（約4000字のWord）をClaudeが作るスキルです。播磨牧師の神学的な考え方と語り口を反映します。","steps":["Claudeアプリ（Cowork）を開く。","聖書箇所・説教題・説教の要点（できれば導入案）を伝えて「説教の構想を練って」と話しかける。","①構想の提案が出るので、確認して直す指示を出す。","②OKを出すと、Wordの草稿が作られる。","出来上がったWordを開いて、自分の言葉で仕上げる。"],"notes":[],"cowork":"説教の草案を作成して／説教の構想を練って","keywords":"説教 草案 草稿 原稿 構想 準備","folder":"","guide":""},{"id":"S:sermon-summary-bulletin","kind":"skill","label":"スキル","name":"sermon-summary-bulletin（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"説教要旨（週報用）の作成と、週報Wordへの流し込み","overview":"播磨牧師の説教原稿を週報の説教要旨に要約し、承認後に週報Word（連結テキストボックス）へバックアップ付きで流し込むCoworkスキルです。2026-10-20（11/15の週）から、要旨の直しは「説教要旨エディタ」（直せるWebページ）で行う運用になりました。","steps":["Claudeアプリ（Cowork）で「11月1日の要旨を作って」のように話しかける（広島教会フォルダの接続が必要）。週報の紙面から入る字数が計算され、その字数で要旨がチャットに出る。","内容を確認して承認する（承認前に週報Wordへは何も書かれない）。要旨は 説教\\作業\\説教要旨\\yymmdd要旨.txt に保存され、説教要旨エディタに載る。","エディタ（Artifactsの一覧にある「説教要旨エディタ」）を開いて直す。字数メーターと、1つ目・2つ目の箱への流し込み予想が出る。2秒ほどで自動保存されるので、保存ボタンは不要。","直し終わったら「再挿入して」と伝える。Wordを閉じていることを確認してから、バックアップを取って週報に挿入される。","Wordで箱からあふれていないか確認し、PDFを書き出す。"],"notes":["週報は「ほかの部分が完成してから」挿入する前提です。34番のベース作成を作り直すと週報が作り直されるので、保存済みの要旨から入れ直します。","特別礼拝などで連結箱がない週は、構成を確認してから進めます。","次の作業は S:sermon-slide-material（説教スライドの素材）です。"],"cowork":"説教要旨を作って／週報に説教要旨を入れて／11月1日の要旨／再挿入して","keywords":"説教 要旨 要約 週報 エディタ 再挿入 連結 テキストボックス","folder":"","guide":""},{"id":"S:sermon-slide-material","kind":"skill","label":"スキル","name":"sermon-slide-material（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"礼拝スライド（説教5枚）の素材：項目名・ポイント・Gem用4パネル画像指示","overview":"説教原稿から、礼拝スライドの説教部分（タイトル＋項目4枚）の素材を作るCoworkスキルです。説教要旨スキルの次に行い、要旨と同じ4項目から作るので、週報とスライドで言葉と強調点がそろいます。外部講師の回はタイトル1枚のみ（季節の風景1枚の指示）。Canvaへの挿入は15番が行います。","steps":["説教要旨（S:sermon-summary-bulletin）が終わっていることを確認し、Claudeアプリ（Cowork）で「11月1日の説教スライドの素材を作って」と話しかける。","説教者・説教題・聖書箇所がExcel（説教箇所・タイトルリスト）と照合される。","説教\\作業\\説教のプレゼンテーション\\yymmdd_説教スライド に yymmdd_確認用.txt と yymmdd_Gem指示.txt ができる。確認用.txt（項目名・ポイント・要旨との照合表）をメモ帳で直す。","直し終わったら「確定して」と伝える。slide_sermon.json が作られ、文字数が報告される。","Gem指示.txt をGemに貼って4パネル画像を作り、同じフォルダに名前を変えずに置く。","15番で「説教スライドを入れて（日付）」（sermon_slides.bat のあと）。"],"notes":["ポイントは原稿・要旨に出ている新共同訳の本文だけを使い、各4行・全角64字以内。スライドの出典の数字は全角です。","既存のファイルは上書きしません。"],"cowork":"説教スライドの素材を作って","keywords":"説教 スライド 素材 項目名 ポイント Gem 画像 4パネル 外部講師 礼拝","folder":"","guide":""},{"id":"S:shinkyodoyaku-viewer","kind":"skill","label":"スキル","name":"shinkyodoyaku-viewer（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"聖書箇所の新共同訳を内蔵ブラウザで開いて表示","overview":"聖書箇所（書名・章・節）を伝えると、Claudeアプリの内蔵ブラウザで聖書アプリ（bible.com）の新共同訳の該当ページを開いて表示するCoworkスキルです。説教準備や礼拝スライド作成（招詞・聖書本文の貼り付け）で本文をコピーするときに使います。","steps":["Claudeアプリ（Cowork）で「詩編23編の新共同訳を出して」のように聖書箇所を伝える。","内蔵ブラウザ（サブブラウザ）に該当ページが開く。","表示された本文を自分でコピーして使う（15番の本文入力など）。"],"notes":[],"cowork":"出エジプト記16章1-15節の新共同訳を出して／ヨハネ6章35節を開いて","keywords":"聖書 新共同訳 聖書箇所 bible.com 本文 表示 ブラウザ 説教準備","folder":"","guide":""},{"id":"S:church-flyer-maker","kind":"skill","label":"スキル","name":"church-flyer-maker（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"教会行事のチラシ（A4縦・片面または表裏）をHTML・PDFで作成","overview":"教会の案内メールや行事情報から、掲示用チラシ（A4縦・片面または表裏2枚）をHTMLとPDFで作るCoworkスキルです。毎回デザイン案を3つ提案し、選んだ案で作ります。素材にない日時・講師名・場所・URLは足しません。","steps":["Claudeアプリ（Cowork）で案内メールや行事情報（本文・箇条書き）を貼り付け、「掲示用のチラシを作って」と話しかける（表裏にしたいときは伝える）。","デザイン案3つが提案されるので、1つ選ぶ。","HTMLとPDFが作られる。内容（日時・場所など）が素材どおりか確認し、直しがあれば伝える。","PDFを印刷して掲示する。"],"notes":[],"cowork":"掲示用のチラシを作って／案内を見栄えよく","keywords":"チラシ 掲示 案内 行事 A4 デザイン案 ポスター 表裏","folder":"","guide":""},{"id":"S:event-explanation","kind":"skill","label":"スキル","name":"event-explanation（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"過去説教から指定テーマの説明を抽出","overview":"過去の説教（2010年〜）から、指定したテーマ（行事名・聖書の概念など）の説明部分を抜き出し、詳細・平均・簡略の3段階の要約と、抜粋をまとめたWordを作るCoworkスキルです。","steps":["Claudeアプリ（Cowork）を開く。","「○○について私の説教でどう説明しているか、まとめて」と話しかける（○○にテーマを入れる）。","チャットに進み具合が表示される。","出来上がったWordが OneDrive\\広島教会\\説教\\説教まとめ に保存される。開いて確認する。"],"notes":[],"cowork":"○○について私の説教でどう説明しているか、まとめて","keywords":"説教 過去 テーマ 説明 行事 抜粋","folder":"","guide":""},{"id":"S:worship-duty-roster","kind":"skill","label":"スキル","name":"worship-duty-roster（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"礼拝司式・受付奉仕者表（半年ごと）","overview":"礼拝の司式・受付の奉仕者表（Excel）を半年ごとに作るCoworkスキルです。","steps":["Claudeアプリ（Cowork）を開く。","「礼拝奉仕者表を作成して」と話しかける。","対象の期間・奉仕者リスト・行事予定を聞かれるので答える。足りないものがあれば追加で質問される。","作成内容が提示されるので確認し、よければ「ファイルを作成して」と伝える。ここで初めてExcelが作られる。"],"notes":[],"cowork":"礼拝奉仕者表を作成して","keywords":"礼拝 奉仕者 司式 受付 当番 表","folder":"","guide":""},{"id":"S:general-minutes","kind":"skill","label":"スキル","name":"general-minutes（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"各種会議の議事録","overview":"さまざまな会議（委員会・教団・地区会・牧師会など）の議事録のWordを作るCoworkスキルです。団体ごとの書式プロファイルを使い、過去の議事録のスタイルに合わせます。","steps":["Claudeアプリ（Cowork）を開く。","今回のアジェンダと、口述テキスト（文字起こし）を添付する（過去の議事録があれば、書式の見本として一緒に添付）。","「○○会の議事録を作って」と話しかける。","出来上がったWordを確認し、直しがあれば指示する。"],"notes":["執事会は22番の自動パイプライン、連盟役員会は33番もあります。"],"cowork":"○○会の議事録を作って","keywords":"議事録 会議 委員会 連盟 牧師会","folder":"","guide":""},{"id":"S:church-member-info-update","kind":"skill","label":"スキル","name":"church-member-info-update（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"教会員の住所・電話変更や新規追加を名簿へ反映","overview":"教会員の住所変更・電話変更・新規会員の追加があったとき、名簿関連の複数のExcelに同じ内容を反映するCoworkスキルです。","steps":["Claudeアプリ（Cowork）を開く。","「○○さんの住所が変わった」と、変更の内容を伝える（新規追加のときは、追加する会員の情報を伝える）。","反映する対象のファイルと変更内容が提示されるので、確認する。","OKを出すと、複数のExcelに反映される。"],"notes":[],"cowork":"住所変更を名簿に反映して","keywords":"名簿 住所変更 電話 引っ越し 新規会員 教会員","folder":"","guide":""},{"id":"S:ubumue-form-builder","kind":"skill","label":"スキル","name":"ubumue-form-builder（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"機関紙『ウブムエ』新号のWordフォーム作成","overview":"機関紙『ウブムエ』（佐々木さんを支援する会）の新しい号のWordフォーム（A4・8ページ・文字数カウント用の数字入り）を、前号フォームと議事録・入稿材料から作るCoworkスキルです。79号（2026年10月）の作業で手順を確立しました。","steps":["Claudeアプリ（Cowork）を開く。","「ウブムエ○○号のフォームを作って」と話しかける（号数を添える）。","前号のフォーム・世話人会の議事録・タスク一覧などを読み取り、足りない情報だけ質問される。","ヘッダー（号数・年月）、季節色、ページ構成、文字数カウント用の数字を整えたフォームが、OneDrive\\広島教会\\佐々木さんを支える会\\ウブムエ の該当号フォルダに作られる。元のファイルは上書きされず、修正は別名（フォーム２…）で保存される。","仮置き（URL・時刻など）や未確認の点の報告を読み、Wordで最終確認する。"],"notes":["LibreOfficeで確認するため、ページ数や折り返しはWordと違うことがあります。必ずWordで最終確認してください。","過去号は OneDrive\\広島教会\\佐々木さんを支える会\\ウブムエ（号ごとのフォルダ）にあります。"],"cowork":"ウブムエ80号のフォームを作って／ウブムエの新しい号のフォームを作って","keywords":"ウブムエ 機関紙 佐々木さんを支援する会 フォーム 新号 文字数 入稿","folder":"","guide":""},{"id":"S:aiainet-report","kind":"skill","label":"スキル","name":"aiainet-report（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"あいあいねっとへの生活支援物資配布活動の報告（毎月のメール、偶数月は報告書）","overview":"毎月第三日曜の生活支援物資配布活動について、フードバンク「あいあいねっと」への報告を作るCoworkスキルです。毎月は報告メール（Outlookで開く下書き .eml、写真添付）を、偶数月はそれに加えて2ヵ月分の活動報告書（Word・PDF）を作ります。日誌（2604日誌.xlsm）と配布写真フォルダ、前回のメール・報告書を読み取り、前回と違う文言には黄色のハイライトを付けます。進め方は毎回Claudeが手順を案内します。","steps":["配布日の後、Claudeアプリ（Cowork）を開き「あいあいねっとへの報告を作成して」と話しかける（「10月の配布報告を作って」のように月を添えてもよい）。","全体の手順と今の段階が表示されるので、案内に沿って写真の候補（番号）を選ぶ。","偶数月は報告書のWord・PDFが報告書フォルダに保存され、確認用の画像がチャットに出る。直したいところはチャットで伝えるか、Wordで直して保存・閉じてから「レイアウトを整えて」と伝える（写真の大きさも合わせ直し、PDFも作り直してくれる）。","メール本文の案を確認してOKを出すと、作業用フォルダに .eml ができる。",".eml をダブルクリック → Outlookの作成画面で黄色の部分を確認 → 本文をクリックしてCtrl+A →蛍光ペン「色なし」でハイライトを消す → 差出人がniftyか確認して送信。"],"notes":["報告書フォルダ：OneDrive\\広島教会\\「班」活動\\2026年度\\5つのパンと2匹の魚班\\フードバンク\\240904_あいあいねっと報告書（作業用フォルダはその中の「作業用」。スクリプト・データ・.emlがここに入る）。","報告書のWordには確認用の黄色ハイライトが残るが、Claudeが作るPDFでは自動で消える。Wordから自分でPDF保存するときは、先にハイライトを消す。","大人の人数は「2ヵ月の配布人数の平均－子どもの数」で計算。子ども・スタッフの数は前回と同じ（違うときはチャットで指示）。","年度が変わったら（2027年度など）、班フォルダの場所をClaudeに伝える。"],"cowork":"あいあいねっとへの報告を作成して／レイアウトを整えて","keywords":"あいあいねっと フードバンク 生活支援物資 配布 報告 報告書 5つのパン 食品 第三日曜 メール","folder":"","guide":""},{"id":"S:support-activity-report","kind":"skill","label":"スキル","name":"support-activity-report（Coworkスキル）","category":"Coworkスキル","status":"利用可","desc":"生活支援物資配布の支援者向け活動報告（1月・7月発行の支援報告 No.○）を雑誌風レイアウトのHTML＋入稿PDFで作成","overview":"毎年1月と7月に支援者へ送る活動報告（A4表裏2ページ、プリントパックで印刷）を作るCoworkスキルです。日誌から6か月分の人数と回数を自動で取り出し、Word原稿と配布写真を流し込んで、動きのあるHTML（HP掲載にも使える）・確認用PDF（A4）・入稿PDF（塗り足し3mm）を作ります。レイアウトは4案（Aマガジン表紙型／Bインフォグラフィック型／Cフォトエッセイ型／D和モダン新聞型）から選び、次回は前回のレイアウトが既定になります。","steps":["号のフォルダ（例：270131_支援報告_10号）に原稿のWord（ファイル名に「原稿」を含める）を入れておく。原稿がまだなくても始められる（ごあいさつ・結びの下書きを作ってくれる）。","Claudeアプリ（Cowork）で「活動報告10号を作って」と話しかける。","最初に「前回のレイアウトで作りますか？」と聞かれる。変える場合は、サイドパネルに出る4案の見本を見てA〜Dから選ぶ。","日誌から取り出した人数の表、原稿の割り当て、写真の候補（番号つき一覧）と配置案が順に出るので、確認・修正する。","号のフォルダにHTML・確認用PDF・入稿PDF・content.json が保存され、確認用の画像がチャットに出る。プリントパックには「_入稿.pdf」を入稿する。"],"notes":["ツール一式（ひな形・プログラム・前回レイアウトの記録）：OneDrive\\広島教会\\「班」活動\\2026年度\\5つのパンと2匹の魚班\\印刷物\\_活動報告ツール","レイアウト見本ページ：Claudeのアーティファクト「活動報告レイアウト見本」（（URL省略））","号のフォルダは「発行日_支援報告_N号」。すでにあればそこに保存、なければ新しく作る。","人数は日誌（YY04日誌.xlsm）の「○○名にお渡しした」から取る。7月号の2〜3月分は前年度の日誌から。日誌はExcelで開いていても保存済みの内容を読む。","10号（2027年1月）は活動5周年の特集号。","原稿の文は書き換えない。受け取りに来られる方の顔が分かる写真は使わない。","年度が変わって班フォルダの場所が変わったら、Claudeに伝える。"],"cowork":"活動報告10号を作って／支援報告を作成して","keywords":"活動報告 支援報告 生活支援物資 配布 5つのパン 2匹の魚 支援者 プリントパック 入稿 1月 7月 レイアウト 雑誌","folder":"","guide":""},{"id":"S:prayer-request-renmei-update","kind":"skill","label":"スキル","name":"prayer-request-renmei-update（Coworkスキル）","category":"Coworkスキル","status":"利用可（2026-10-21 追加）","desc":"協力伝道カレンダー（連盟）の画像・PDFから教会名を抽出し、祈祷会の差し込みデータExcelのS列（連盟教会）に毎月追記する","overview":"日本バプテスト連盟「協力伝道カレンダー」（月ごとに表裏2枚の画像またはPDF）から教会・団体名を読み取り、祈祷会資料用Excel（260130_祈祷会_差し込みデータ.xlsx）のS列（連盟教会）に、毎週水曜の行へ「直前の日曜〜土曜」の分として入れるCoworkスキルです。書き込み前に、入れる行とセルの表を示して承認を取ります。","steps":["Excelの差し込みデータと、教会HP更新ツール（30番 hp_update.pyw）を閉じておく。","Claudeアプリ（Cowork）で「協力伝道カレンダーを入れて」と話しかけ、カレンダーの画像（またはPDF）を渡す。","示された「どの行のどのセルに何を入れるか」の表を確認して承認する。読み取りに自信のない文字は明記される。","承認後、バックアップを作ってS列の対象セルだけに書き込まれる（折り返し表示を設定）。結果の報告を確認する。"],"notes":["月の変わり目の週は途中までしか入らない。既にセルに内容があれば消さず、末尾に「、」で追記し、重複は入れない。","青字の予定・行事は原則入れない（入れるかは確認される）。県名・祈りの内容・委員長名・括弧内の補足は入れない。","Excelや教会HP更新ツールが開いたままだと、書き込み後にファイルを移動・上書きできなくなることがある。"],"cowork":"協力伝道カレンダーを入れて／S列を更新して","keywords":"協力伝道カレンダー 連盟教会 祈祷会 差し込みデータ S列 教会名 月次 祈り 連盟","folder":"","guide":""}]</script>
<script>
(function(){
var DATA=JSON.parse(document.getElementById('data').textContent);
function fold(t){
  t=(t||'').normalize('NFKC').toLowerCase();
  var o='';
  for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);o+=(c>=0x30A1&&c<=0x30F6)?String.fromCharCode(c-0x60):t[i];}
  return o.replace(/\s+/g,'');
}
DATA.forEach(function(e){
  e._main=fold([e.id,e.name,e.category,e.desc,e.keywords,e.folder,e.status,e.cowork,e.guide].join(' '));
  e._all=fold([e._main,e.overview,e.steps.join(' '),e.notes.join(' ')].join(' '));
});
var filter='all',q=document.getElementById('q'),list=document.getElementById('list'),cnt=document.getElementById('count');
var CH=[['all','すべて'],['system','システム'],['skill','スキル'],['run','稼働中']];
var chips=document.getElementById('chips');
CH.forEach(function(c){
  var b=document.createElement('button');b.className='chip';b.textContent=c[1];b.setAttribute('aria-pressed',c[0]==='all');
  b.onclick=function(){filter=c[0];[].forEach.call(chips.children,function(x,i){x.setAttribute('aria-pressed',CH[i][0]===filter)});render();};
  chips.appendChild(b);
});
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function section(box,title,node){box.appendChild(el('h3',null,title));box.appendChild(node);}
function card(e,open){
  var d=document.createElement('details');if(open)d.open=true;
  var s=document.createElement('summary');
  var top=el('div','top');
  var l=el('div');l.appendChild(el('span','no',e.label));l.appendChild(el('span','nm',e.name));
  top.appendChild(l);top.appendChild(el('span','st'+(e.status.indexOf('稼働')===0?' ok':''),e.status));
  s.appendChild(top);s.appendChild(el('div','ds',e.desc));d.appendChild(s);
  var b=el('div','body');
  section(b,'どんなシステムか',el('p',null,e.overview));
  var ol=el('ol');e.steps.forEach(function(t){ol.appendChild(el('li',null,t));});section(b,'操作手順',ol);
  if(e.cowork)section(b,'Coworkへの話しかけ例',el('p',null,'「'+e.cowork+'」'));
  if(e.notes.length){var ul=el('ul');e.notes.forEach(function(t){ul.appendChild(el('li',null,t));});section(b,'メモ・注意',ul);}
  b.appendChild(el('div','meta','分類：'+e.category+(e.folder?'　／　フォルダ：'+e.folder:'')));
  d.appendChild(b);return d;
}
function render(){
  var terms=q.value.replace(/\u3000/g,' ').split(/\s+/).filter(Boolean).map(fold);
  var hit=DATA.filter(function(e){
    if(filter==='system'&&e.kind!=='system')return false;
    if(filter==='skill'&&e.kind!=='skill')return false;
    if(filter==='run'&&e.status.indexOf('稼働')!==0)return false;
    return terms.every(function(t){return e._all.indexOf(t)>=0;});
  });
  if(terms.length){hit=hit.filter(function(e){return terms.every(function(t){return e._main.indexOf(t)>=0;})}).concat(hit.filter(function(e){return !terms.every(function(t){return e._main.indexOf(t)>=0;})}));}
  list.textContent='';
  if(!hit.length){list.appendChild(el('div','empty','該当するものがありません'));}
  var one=hit.length===1;
  hit.forEach(function(e){list.appendChild(card(e,one));});
  cnt.textContent=hit.length+'件'+(terms.length?'（'+terms.join(' ')+'）':'');
}
q.addEventListener('input',render);
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
